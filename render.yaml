databases:
  - name: flowcast-db
    plan: free
    region: singapore
    databaseName: flowcast
    user: flowcast

services:
  - type: web
    name: flowcast-backend
    runtime: docker
    plan: free
    region: singapore
    branch: dev
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowcast-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_SETUP_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: API_REQUEST_TIMEOUT_SECONDS
        value: "2.8"
      - key: REDIS_ENABLED
        value: "false"
      - key: RATE_LIMIT_REDIS_ENABLED
        value: "false"
      - key: REAL_DATA_ONLY
        value: "false"
      - key: AI_ENABLED
        value: "false"
